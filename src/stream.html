<!doctype html>
<html lang="en" class="h-full">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Share Your Screen</title>
		<link href="tailwind.css" rel="stylesheet" />
		<style>
			*,
			*::before,
			*::after {
				box-sizing: border-box;
			}

			html,
			body {
				height: 100%;
				overflow: hidden;
			}

			::-webkit-scrollbar {
				width: 4px;
			}

			::-webkit-scrollbar-track {
				background: transparent;
			}

			::-webkit-scrollbar-thumb {
				background: #2a2d34;
				border-radius: 2px;
			}

			.source-card {
				border: 1.5px solid var(--color-border);
				transition:
					border-color 0.15s,
					background 0.15s,
					box-shadow 0.15s;
			}

			.source-card:hover {
				background: var(--color-elevated);
				border-color: #3a3d44;
			}

			.source-card.selected {
				border-color: var(--color-accent);
				background: rgba(87, 100, 242, 0.09);
				box-shadow: 0 0 0 3px rgba(87, 100, 242, 0.1);
			}

			select {
				appearance: none;
				-webkit-appearance: none;
			}

			.select-wrap {
				position: relative;
			}

			.select-wrap .chevron {
				position: absolute;
				right: 10px;
				top: 50%;
				transform: translateY(-50%);
				pointer-events: none;
			}

			.tab-btn {
				color: var(--color-muted);
			}

			.tab-btn.active-tab {
				background: var(--color-border);
				color: var(--color-primary);
			}

			#share-btn:disabled {
				background: var(--color-elevated);
				color: var(--color-muted);
				cursor: not-allowed;
			}

			#share-btn:not(:disabled):hover {
				background: var(--color-accent-dim);
			}
		</style>
	</head>

	<body class="bg-base h-full text-primary">
		<div class="flex flex-col h-full overflow-hidden">
			<div
				class="hidden px-6 pt-5 pb-4 border-border-sub border-b shrink-0"
			>
				<div class="flex justify-between items-center">
					<div>
						<div class="font-bold text-[18px] text-primary">
							Share Your Screen
						</div>
						<div class="mt-0.5 text-[13px] text-muted">
							Select a window or screen to broadcast
						</div>
					</div>
				</div>
			</div>

			<div class="flex flex-1 min-h-0">
				<div
					id="sources-panel"
					class="flex flex-col flex-1 p-5 min-w-0 overflow-hidden"
				>
					<div
						class="flex gap-1 bg-sidebar mb-4 p-1 rounded-lg shrink-0"
					>
						<button
							id="tab-screen"
							class="flex-1 py-1.5 rounded-md font-semibold text-sm transition-all cursor-pointer tab-btn active-tab"
						>
							Screens
						</button>
						<button
							id="tab-window"
							class="flex-1 py-1.5 rounded-md font-semibold text-sm transition-all cursor-pointer tab-btn"
						>
							Applications
						</button>
						<button
							id="tab-obs"
							class="flex-1 py-1.5 rounded-md font-semibold text-sm transition-all cursor-pointer tab-btn"
						>
							OBS Virtual Camera
						</button>
					</div>

					<div class="flex-1 pr-1 overflow-y-auto">
						<div
							id="grid-container"
							class="gap-3 grid grid-cols-2 pb-4"
						>
							<div
								class="col-span-2 py-10 text-muted text-sm text-center"
							>
								Loading sources...
							</div>
						</div>
					</div>
				</div>

				<div
					id="panel-divider"
					class="my-4 bg-border-sub w-px shrink-0"
				></div>

				<div
					class="flex flex-col gap-5 p-5 w-70 overflow-y-auto shrink-0"
				>
					<div class="flex gap-3">
						<div class="flex-1">
							<div
								class="mb-2 font-semibold text-muted text-xs uppercase tracking-wide"
							>
								Resolution
							</div>
							<div class="select-wrap">
								<select
									id="res-select"
									class="bg-surface px-3.5 py-2.5 pr-10 border border-border hover:border-accent focus:border-accent rounded-lg outline-none w-full font-sans text-primary text-sm transition-colors cursor-pointer"
								>
									<option value="480">480p</option>
									<option value="720" selected>720p</option>
									<option value="1080">1080p</option>
									<option value="1440">1440p (2K)</option>
									<option value="2160">2160p (4K)</option>
								</select>
								<span
									class="ml-auto material-symbols-rounded font-normal chevron"
								>
									arrow_drop_down
								</span>
							</div>
						</div>

						<div class="flex-1">
							<div
								class="mb-2 font-semibold text-muted text-xs uppercase tracking-wide"
							>
								Frame Rate
							</div>
							<div class="select-wrap">
								<select
									id="fps-select"
									class="bg-surface px-3.5 py-2.5 pr-10 border border-border hover:border-accent focus:border-accent rounded-lg outline-none w-full font-sans text-primary text-sm transition-colors cursor-pointer"
								>
									<option value="15">15 FPS</option>
									<option value="30" selected>30 FPS</option>
									<option value="60">60 FPS</option>
								</select>
								<span
									class="ml-auto material-symbols-rounded font-normal chevron"
								>
									arrow_drop_down
								</span>
							</div>
						</div>
					</div>

					<div>
						<div
							class="mb-2 font-semibold text-muted text-xs uppercase tracking-wide"
						>
							Stream Mode
						</div>
						<div class="select-wrap">
							<select
								id="mode-select"
								class="bg-surface px-3.5 py-2.5 pr-10 border border-border hover:border-accent focus:border-accent rounded-lg outline-none w-full font-sans text-primary text-sm transition-colors cursor-pointer"
							>
								<option value="motion">
									Prefer Smoothness
								</option>
								<option value="detail">Prefer Clarity</option>
							</select>
							<span
								class="ml-auto material-symbols-rounded font-normal chevron"
							>
								arrow_drop_down
							</span>
						</div>
					</div>

					<div>
						<div
							class="flex justify-between mb-2 font-semibold text-muted text-xs uppercase tracking-wide"
						>
							<span>Include Audio</span>
							<span id="inc-count" class="hidden text-accent"
								>0</span
							>
						</div>
						<div
							id="audio-include"
							class="flex flex-col bg-surface p-1 border border-border rounded-lg w-full h-full overflow-y-auto"
						>
							<div class="mt-5 text-muted text-sm text-center">
								Loading...
							</div>
						</div>
					</div>

					<div
						id="exclude-container"
						class="hidden opacity-50 transition-opacity duration-200 pointer-events-none"
					>
						<div
							class="flex justify-between mb-2 font-semibold text-muted text-xs uppercase tracking-wide"
						>
							<span>Exclude Audio</span>
							<span id="exc-count" class="hidden text-accent"
								>0</span
							>
						</div>
						<div
							id="audio-exclude"
							class="flex flex-col bg-surface p-1 border border-border rounded-lg w-full h-32 overflow-y-auto"
						>
							<div class="mt-5 text-muted text-sm text-center">
								Loading...
							</div>
						</div>
						<div class="mt-1.5 text-[11px] text-muted leading-snug">
							Only applied when sharing Entire System.
						</div>
					</div>

					<div class="mt-auto pt-2">
						<button
							id="share-btn"
							disabled
							class="flex justify-center items-center gap-2 bg-accent py-2 rounded-lg w-full font-semibold text-white text-sm active:scale-[0.98] transition-all"
						>
							<span
								class="material-symbols-rounded font-thin text-2xl"
							>
								cast
							</span>
							Start
						</button>
					</div>
				</div>
			</div>
		</div>

		<script>
			let allSources = [];
			let currentType = "screen";
			let selectedSourceId = null;
			let obsSourcesLoaded = false;

			let includeAudioList = [{ "node.name": "entire-system" }];
			let excludeAudioList = [];

			const sourcesContainer = document.getElementById("grid-container");
			const sourcesPanel = document.getElementById("sources-panel");
			const tabScreen = document.getElementById("tab-screen");
			const tabWindow = document.getElementById("tab-window");
			const tabOBS = document.getElementById("tab-obs");
			const shareBtn = document.getElementById("share-btn");

			function setTab(type) {
				currentType = type;
				tabScreen.classList.toggle("active-tab", type === "screen");
				tabScreen.classList.toggle("text-muted", type !== "screen");
				tabWindow.classList.toggle("active-tab", type === "window");
				tabWindow.classList.toggle("text-muted", type !== "window");
				tabOBS.classList.toggle("active-tab", type === "obs");
				tabOBS.classList.toggle("text-muted", type !== "obs");
				selectedSourceId = null;
				shareBtn.disabled = true;

				if (type === "obs") {
					loadObsSources();
				} else {
					renderSources();
				}
			}

			async function loadObsSources() {
				sourcesContainer.innerHTML = `<div class="col-span-2 py-10 text-muted text-sm text-center">Looking for OBS Virtual Camera...</div>`;

				try {
					if (!navigator.mediaDevices?.enumerateDevices) {
						throw new Error("mediaDevices unavailable");
					}

					let devices =
						await navigator.mediaDevices.enumerateDevices();
					let videoInputs = devices.filter(
						(d) => d.kind === "videoinput"
					);

					if (
						videoInputs.length &&
						videoInputs.every((d) => !d.label)
					) {
						try {
							const tempStream =
								await navigator.mediaDevices.getUserMedia({
									video: true,
								});
							tempStream.getTracks().forEach((t) => t.stop());
							devices =
								await navigator.mediaDevices.enumerateDevices();
							videoInputs = devices.filter(
								(d) => d.kind === "videoinput"
							);
						} catch (permErr) {
							sourcesContainer.innerHTML = `<div class="col-span-2 py-10 text-muted text-sm text-center">Camera permission is needed to detect OBS Virtual Camera</div>`;
							return;
						}
					}

					const obsDevices = videoInputs.filter((d) =>
						/obs/i.test(d.label)
					);

					if (obsDevices.length === 0) {
						sourcesContainer.innerHTML = `<div class="col-span-2 py-10 text-muted text-sm text-center leading-relaxed">OBS Virtual Camera not found.<br>Start it in OBS (Start Virtual Camera) then reopen this tab.</div>`;
						return;
					}

					const withThumbs = await Promise.all(
						obsDevices.map(async (d) => ({
							id: `obs:${d.deviceId}`,
							name: d.label || "OBS Virtual Camera",
							deviceId: d.deviceId,
							thumbnail: await grabDeviceThumbnail(d.deviceId),
						}))
					);

					allSources = allSources
						.filter((s) => !s.id.startsWith("obs:"))
						.concat(withThumbs);

					obsSourcesLoaded = true;
					renderSources();
				} catch (e) {
					sourcesContainer.innerHTML = `<div class="col-span-2 py-10 text-sm text-center" style="color: var(--color-danger)">Error loading OBS Virtual Camera</div>`;
				}
			}

			async function grabDeviceThumbnail(deviceId) {
				let stream;
				try {
					stream = await navigator.mediaDevices.getUserMedia({
						video: { deviceId: { exact: deviceId } },
					});
					const video = document.createElement("video");
					video.srcObject = stream;
					video.muted = true;
					await video.play();
					await new Promise((r) => setTimeout(r, 150)); // let a frame land

					const canvas = document.createElement("canvas");
					canvas.width = video.videoWidth || 320;
					canvas.height = video.videoHeight || 180;
					canvas
						.getContext("2d")
						.drawImage(video, 0, 0, canvas.width, canvas.height);

					return canvas.toDataURL("image/jpeg", 0.75);
				} catch (e) {
					return ""; // renderSources still works fine with a blank thumbnail
				} finally {
					stream?.getTracks().forEach((t) => t.stop());
				}
			}

			function renderSources() {
				sourcesContainer.innerHTML = "";
				const filtered = allSources.filter((s) =>
					s.id.startsWith(`${currentType}:`)
				);

				if (filtered.length === 0) {
					sourcesContainer.innerHTML = `<div class="col-span-2 py-10 text-muted text-sm text-center">No ${currentType === "obs" ? "source" : currentType}s found</div>`;
					return;
				}

				filtered.forEach((source) => {
					const div = document.createElement("div");
					div.className = `source-card rounded-lg overflow-hidden cursor-pointer transition-all duration-300 bg-surface${selectedSourceId === source.id ? " selected" : ""}`;
					div.onclick = () => selectSource(source.id);
					div.innerHTML = `
            <div class="relative flex justify-center items-center bg-black border-border border-b aspect-video">
                <img src="${source.thumbnail}" class="max-w-full max-h-full object-contain">
                ${source.appIcon && currentType === "window" ? `<img src="${source.appIcon}" class="right-2 bottom-2 absolute bg-black/50 p-0.5 rounded w-6 h-6">` : ""}
            </div>
            <div class="px-3 py-2 font-medium text-primary text-sm truncate" title="${source.name}">${source.name}</div>
        `;
					sourcesContainer.appendChild(div);
				});
			}

			function selectSource(id) {
				selectedSourceId = id;
				renderSources();
				shareBtn.disabled = false;
			}

			function updateAudioState() {
				const excContainer =
					document.getElementById("exclude-container");
				const isEntireSystem = includeAudioList.some(
					(a) => a["node.name"] === "entire-system"
				);
				const isNone = includeAudioList.length === 0;

				if (isEntireSystem) {
					excContainer.classList.remove(
						"opacity-50",
						"pointer-events-none"
					);
				} else {
					excContainer.classList.add(
						"opacity-50",
						"pointer-events-none"
					);
					excludeAudioList = [];
				}

				const incCount = document.getElementById("inc-count");
				if (!isEntireSystem && !isNone) {
					incCount.textContent = includeAudioList.length;
					incCount.classList.remove("hidden");
				} else {
					incCount.classList.add("hidden");
				}

				const excCount = document.getElementById("exc-count");
				if (excludeAudioList.length > 0) {
					excCount.textContent = excludeAudioList.length;
					excCount.classList.remove("hidden");
				} else {
					excCount.classList.add("hidden");
				}

				document
					.querySelectorAll(".audio-opt")
					.forEach((el) => el._updateUI?.());
			}

			function renderAudioLists(audioSources) {
				const incContainer = document.getElementById("audio-include");
				const excContainer = document.getElementById("audio-exclude");

				incContainer.innerHTML = "";
				excContainer.innerHTML = "";

				const createOption = (source, isInclude) => {
					const div = document.createElement("div");
					div.className =
						"audio-opt px-2.5 py-1.5 text-sm rounded cursor-pointer mb-0.5 flex items-center justify-between transition-colors";

					const nodeName = source["node.name"];
					const serial = source["object.serial"];
					const appName =
						nodeName === "entire-system"
							? "Entire System"
							: nodeName === "none"
								? "Don't Share Audio"
								: source["application.name"] || nodeName;

					div._updateUI = () => {
						const list = isInclude
							? includeAudioList
							: excludeAudioList;
						let isSelected;
						if (nodeName === "none") {
							isSelected =
								isInclude && includeAudioList.length === 0;
						} else {
							isSelected = list.some(
								(a) =>
									(serial && a["object.serial"] === serial) ||
									a["node.name"] === nodeName
							);
						}
						div.className = `audio-opt px-2.5 py-1.5 text-sm rounded cursor-pointer mb-0.5 flex items-center justify-between transition-colors ${isSelected ? "bg-accent text-white font-medium" : "text-primary hover:bg-hover"}`;
						div.querySelector(".audio-check").className =
							`audio-check shrink-0 w-4 h-4 rounded border-2 border-current flex items-center justify-center transition-colors`;
						div.querySelector(
							".audio-check"
						).style.backgroundColor = isSelected
							? "white"
							: "transparent";
						div.querySelector(
							".material-symbols-rounded"
						).classList.toggle("hidden", !isSelected);
					};

					div.onclick = () => {
						if (isInclude) {
							if (nodeName === "none") {
								includeAudioList = [];
							} else if (nodeName === "entire-system") {
								includeAudioList = [source];
							} else {
								includeAudioList = includeAudioList.filter(
									(a) =>
										a["node.name"] !== "entire-system" &&
										a["node.name"] !== "none"
								);
								const index = includeAudioList.findIndex(
									(a) =>
										(serial &&
											a["object.serial"] === serial) ||
										a["node.name"] === nodeName
								);
								if (index > -1) {
									includeAudioList.splice(index, 1);
								} else {
									includeAudioList.push(source);
								}
							}
						} else {
							const index = excludeAudioList.findIndex(
								(a) =>
									(serial && a["object.serial"] === serial) ||
									a["node.name"] === nodeName
							);
							if (index > -1) {
								excludeAudioList.splice(index, 1);
							} else {
								excludeAudioList.push(source);
							}
						}
						updateAudioState();
					};
					div.innerHTML = `
    <span class="pr-2 truncate">${appName}</span>
    <span class="flex justify-center items-center bg-transparent border-2 border-current rounded w-4 h-4 audio-check shrink-0">
        <span class="hidden mt-0.5 material-symbols-rounded font-semibold text-accent text-sm">check</span>
    </span>
`;
					div._updateUI();
					return div;
				};

				incContainer.appendChild(
					createOption({ "node.name": "none" }, true)
				);
				incContainer.appendChild(
					createOption({ "node.name": "entire-system" }, true)
				);

				audioSources.forEach((s) => {
					incContainer.appendChild(createOption(s, true));
					excContainer.appendChild(createOption(s, false));
				});

				updateAudioState();
			}

			window.addEventListener("DOMContentLoaded", async () => {
				tabScreen.onclick = () => setTab("screen");
				tabWindow.onclick = () => setTab("window");
				tabOBS.onclick = () => setTab("obs");

				shareBtn.onclick = async () => {
					if (!selectedSourceId) return;
					const resValue =
						document.getElementById("res-select").value;
					const fpsValue = parseInt(
						document.getElementById("fps-select").value,
						10
					);
					const contentHint =
						document.getElementById("mode-select").value;

					const includeAudio = includeAudioList;
					const excludeAudio = excludeAudioList;

					let resolution = { width: 1920, height: 1080 };
					switch (resValue) {
						case "480":
							resolution = { width: 854, height: 480 };
							break;
						case "720":
							resolution = { width: 1280, height: 720 };
							break;
						case "1080":
							resolution = { width: 1920, height: 1080 };
							break;
						case "1440":
							resolution = { width: 2560, height: 1440 };
							break;
						case "2160":
							resolution = { width: 3840, height: 2160 };
							break;
					}

					const isVirtualCamera = selectedSourceId.startsWith("obs:");

					window.streamAPI.selectSource({
						sourceId: selectedSourceId,
						sourceType: isVirtualCamera
							? "obs-camera"
							: currentType,
						deviceId: isVirtualCamera
							? selectedSourceId.slice("obs:".length)
							: undefined,
						fps: fpsValue,
						resolution,
						includeAudio,
						excludeAudio,
						contentHint,
					});
				};

				try {
					const sessionInfo = await window.streamAPI.getSessionType();

					if (sessionInfo.isWayland) {
						sourcesPanel.classList.add("hidden");
						document
							.getElementById("panel-divider")
							.classList.add("hidden");
						document
							.querySelector(".w-70")
							.classList.replace("w-70", "w-full");

						const settingsPanel = document.querySelector(
							".flex.flex-col.p-5.gap-5"
						);
						const previewEl = document.createElement("div");
						previewEl.innerHTML = `
            <div class="mb-2 font-semibold text-muted text-xs uppercase tracking-wide">Selected Source</div>
            <div id="wayland-preview" class="group relative bg-black border border-border rounded-lg overflow-hidden cursor-pointer" style="aspect-ratio:16/9">
                <div id="preview-loading" class="absolute inset-0 flex justify-center items-center text-muted text-sm">Waiting for selection...</div>
                <img id="preview-thumb" class="hidden w-full h-full object-contain">
                <div id="preview-name" class="hidden right-0 bottom-0 left-0 absolute bg-black/60 px-3 py-2 font-medium text-white text-xs truncate"></div>
                <div id="preview-change" class="hidden absolute inset-0 flex justify-center items-center bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity">
                    <span class="font-semibold text-white text-sm">Click to change</span>
                </div>
            </div>
        `;
						settingsPanel.prepend(previewEl);

						const pickSource = async () => {
							document.getElementById(
								"preview-loading"
							).textContent = "Opening picker...";
							document
								.getElementById("preview-loading")
								.classList.remove("hidden");
							document
								.getElementById("preview-thumb")
								.classList.add("hidden");
							document
								.getElementById("preview-name")
								.classList.add("hidden");
							document
								.getElementById("preview-change")
								.classList.add("hidden");

							allSources = await window.streamAPI.getSources();
							const source = allSources[0];
							if (!source) return;

							selectedSourceId = source.id;
							shareBtn.disabled = false;

							document
								.getElementById("preview-loading")
								.classList.add("hidden");
							document.getElementById("preview-thumb").src =
								source.thumbnail;
							document
								.getElementById("preview-thumb")
								.classList.remove("hidden");
							document.getElementById(
								"preview-name"
							).textContent = source.name;
							document
								.getElementById("preview-name")
								.classList.remove("hidden");
							document
								.getElementById("preview-change")
								.classList.remove("hidden");
						};

						document.getElementById("wayland-preview").onclick =
							() => pickSource();
						await pickSource();
					} else {
						// x11 (and others)
						allSources = await window.streamAPI.getSources();
						if (
							allSources.find((s) => s.id.startsWith("screen:"))
						) {
							setTab("screen");
						} else {
							setTab("window");
						}
					}
				} catch (e) {
					sourcesContainer.innerHTML = `<div class="col-span-2 py-10 text-sm text-center" style="color: var(--color-danger)">Error loading sources</div>`;
				}

				try {
					const audioSources =
						await window.streamAPI.getAudioSources();
					if (audioSources && audioSources.length > 0) {
						renderAudioLists(audioSources);
					} else {
						document.getElementById("audio-include").innerHTML =
							`<div class="mt-5 text-muted text-xs text-center">No apps found</div>`;
						document.getElementById("audio-exclude").innerHTML =
							`<div class="mt-5 text-muted text-xs text-center">No apps found</div>`;
					}
				} catch (e) {}
			});
		</script>
	</body>
</html>
